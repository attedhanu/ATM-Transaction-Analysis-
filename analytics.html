<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ATM Analytics</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <h2>ATM Analytics</h2>

        <a href="/">
            📊 Dashboard
        </a>

        <a href="/transactions">
            💳 Transactions
        </a>

        <a href="/analytics">
            📈 Analytics
        </a>

    </div>


    <!-- ================= MAIN ================= -->

    <div class="main">

        <h1>ATM Analytics</h1>

        <p class="subtitle">
            Detailed analysis of ATM transaction data
        </p>


        <!-- ================= CHARTS ================= -->

        <div class="charts">


            <!-- Channel -->

            <div class="chart-box">

                <h2>Transactions by Channel</h2>

                <canvas id="channelChart"></canvas>

            </div>


            <!-- Transaction Type -->

            <div class="chart-box">

                <h2>Transaction Type</h2>

                <canvas id="typeChart"></canvas>

            </div>


            <!-- Customer Occupation -->

            <div class="chart-box">

                <h2>Customer Occupation</h2>

                <canvas id="occupationChart"></canvas>

            </div>


            <!-- Location -->

            <div class="chart-box">

                <h2>Top Locations</h2>

                <canvas id="locationChart"></canvas>

            </div>


            <!-- Login Attempts -->

            <div class="chart-box">

                <h2>Login Attempts</h2>

                <canvas id="loginChart"></canvas>

            </div>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>


        // --------------------------------
        // CHANNEL
        // --------------------------------

        const channelData =
            {{ channel_data | tojson }};

        new Chart(
            document.getElementById("channelChart"),
            {
                type: "doughnut",

                data: {

                    labels:
                        Object.keys(channelData),

                    datasets: [{

                        label: "Transactions",

                        data:
                            Object.values(channelData)

                    }]

                }
            }
        );


        // --------------------------------
        // TRANSACTION TYPE
        // --------------------------------

        const typeData =
            {{ type_data | tojson }};

        new Chart(
            document.getElementById("typeChart"),
            {
                type: "bar",

                data: {

                    labels:
                        Object.keys(typeData),

                    datasets: [{

                        label: "Transactions",

                        data:
                            Object.values(typeData)

                    }]

                },

                options: {

                    responsive: true,

                    scales: {

                        y: {

                            beginAtZero: true

                        }

                    }

                }

            }
        );


        // --------------------------------
        // OCCUPATION
        // --------------------------------

        const occupationData =
            {{ occupation_data | tojson }};

        new Chart(
            document.getElementById("occupationChart"),
            {
                type: "pie",

                data: {

                    labels:
                        Object.keys(occupationData),

                    datasets: [{

                        data:
                            Object.values(occupationData)

                    }]

                }

            }
        );


        // --------------------------------
        // LOCATION
        // --------------------------------

        const locationData =
            {{ location_data | tojson }};

        new Chart(
            document.getElementById("locationChart"),
            {
                type: "bar",

                data: {

                    labels:
                        Object.keys(locationData),

                    datasets: [{

                        label: "Transactions",

                        data:
                            Object.values(locationData)

                    }]

                },

                options: {

                    responsive: true,

                    indexAxis: "y",

                    scales: {

                        x: {

                            beginAtZero: true

                        }

                    }

                }

            }
        );


        // --------------------------------
        // LOGIN ATTEMPTS
        // --------------------------------

        const loginData =
            {{ login_data | tojson }};

        new Chart(
            document.getElementById("loginChart"),
            {
                type: "line",

                data: {

                    labels:
                        Object.keys(loginData),

                    datasets: [{

                        label: "Number of Transactions",

                        data:
                            Object.values(loginData),

                        tension: 0.3

                    }]

                },

                options: {

                    responsive: true,

                    scales: {

                        y: {

                            beginAtZero: true

                        }

                    }

                }

            }
        );

    </script>


</body>

</html>
